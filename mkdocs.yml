site_name: Drive Remote Terminal
site_description: 'Drive remote interactive TUIs over SSH + tmux/screen — type, wait, screenshot, read. Claude Code & Grok plugin skill.'
site_url: https://88plug.github.io/drive-remote-terminal/
repo_url: https://github.com/88plug/drive-remote-terminal
repo_name: 88plug/drive-remote-terminal
edit_uri: edit/main/docs/
use_directory_urls: true
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - References:
      - tmux keys & capture-pane: reference/tmux-keys.md
      - GNU screen fallback: reference/screen.md
      - Advanced SSH & sync: reference/advanced-and-ssh.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/88plug/drive-remote-terminal
